name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIBEFIELD_HOME: ${{ github.workspace }}/.hermes/ci-data
      VIBEFIELD_ALLOW_VIDEO: '0'
      VIBEFIELD_EXPERIMENTAL_CODEX_IMAGES: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: node apps/cli/dist/index.mjs --help
